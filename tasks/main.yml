---
# tasks file for vector-role
- name: Install and configure vector
  become: true
  block:
    - name: Create vector install/config/data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ vector_install_dir }}"
        - "{{ vector_config_dir }}"
        - "{{ vector_data_dir }}"

    - name: Check whether vector is already unpacked
      ansible.builtin.stat:
        path: "{{ vector_install_dir }}/bin/vector"
      register: vector_bin_check

    - name: Download vector distrib
      ansible.builtin.get_url:
        url: "{{ vector_download_url }}"
        dest: "{{ vector_archive_path }}"
        mode: "0644"
      when: not vector_bin_check.stat.exists

    - name: Unpack vector distrib
      ansible.builtin.unarchive:
        src: "{{ vector_archive_path }}"
        dest: "{{ vector_install_dir }}"
        remote_src: true
        extra_opts:
          - --strip-components=2
      when: not vector_bin_check.stat.exists

    - name: Link vector binary into PATH
      ansible.builtin.file:
        src: "{{ vector_install_dir }}/bin/vector"
        dest: "{{ vector_bin_path }}"
        state: link

    - name: Deploy vector configuration
      ansible.builtin.template:
        src: vector.yaml.j2
        dest: "{{ vector_config_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart vector

    - name: Deploy vector systemd unit
      ansible.builtin.template:
        src: vector.service.j2
        dest: "{{ vector_systemd_unit_path }}"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd daemon
        - Restart vector

    - name: Flush handlers so the service starts with the final config
      ansible.builtin.meta: flush_handlers

    - name: Enable and start vector service
      ansible.builtin.service:
        name: "{{ vector_service_name }}"
        enabled: true
        state: started
