---
# defaults file for vector-role
# Low-precedence variables meant to be overridden by the playbook / inventory.

# Version of Vector (https://vector.dev) to install.
vector_version: "0.46.0"

# Platform triplet of the release tarball (see https://vector.dev/download/).
vector_arch: "x86_64-unknown-linux-gnu"

# Filesystem layout.
vector_install_dir: /opt/vector
vector_bin_path: /usr/local/bin/vector
vector_config_dir: /etc/vector
vector_data_dir: /var/lib/vector

# vector.yaml content: a single source -> single sink pipeline is deployed by
# default. Override with your own source/sink types as needed.
vector_source: journald
vector_sink_type: console
